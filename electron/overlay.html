<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: transparent;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      user-select: none;
    }
    #stack {
      position: fixed;
      right: 12px;
      bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 396px;
    }
    .card {
      display: flex;
      gap: 12px;
      padding: 14px 16px;
      background: rgba(22, 24, 28, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      transform: translateX(430px);
      animation: slidein 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      position: relative;
      overflow: hidden;
    }
    .card.out { animation: slideout 0.35s ease-in forwards; }
    @keyframes slidein { to { transform: translateX(0); } }
    @keyframes slideout { to { transform: translateX(430px); opacity: 0; } }

    /* 左侧识别条：普通=Xbox 绿，稀有=金 */
    .card::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: #107c10;
    }
    .card.rare::before { background: linear-gradient(180deg, #e8c352, #b8860b); }
    .card.rare { border-color: rgba(232, 195, 82, 0.35); }

    .icon {
      width: 56px; height: 56px;
      flex: none;
      border-radius: 8px;
      background: #26292f;
      object-fit: cover;
    }
    .icon.fallback { display: flex; align-items: center; justify-content: center; font-size: 30px; }

    .body { flex: 1; min-width: 0; }
    .game {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6cc04a;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card.rare .game { color: #e8c352; }
    .title {
      font-size: 15px;
      font-weight: 600;
      margin: 2px 0 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .desc {
      font-size: 12px;
      color: #9aa0a6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .badge {
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #e8c352;
      background: rgba(232, 195, 82, 0.12);
      border: 1px solid rgba(232, 195, 82, 0.3);
      padding: 2px 8px;
      border-radius: 999px;
    }
    .progress {
      margin-top: 6px;
      height: 4px;
      border-radius: 2px;
      background: #2b2e34;
      overflow: hidden;
    }
    .progress > div { height: 100%; background: #107c10; border-radius: 2px; }
    .hint {
      text-align: right;
      font-size: 10px;
      color: rgba(255,255,255,0.25);
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div id="stack"></div>
  <script src="overlay.js"></script>
</body>
</html>
