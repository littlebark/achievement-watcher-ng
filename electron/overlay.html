<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: transparent;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      user-select: none;
    }
    #stack {
      position: fixed;
      right: 12px;
      bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 396px;
    }
    .card {
      display: flex;
      gap: 12px;
      padding: 14px 16px;
      background: rgba(22, 24, 28, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      transform: translateX(430px);
      animation: slidein 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      position: relative;
      overflow: hidden;
    }
    .card.out { animation: slideout 0.35s ease-in forwards; }
    @keyframes slidein { to { transform: translateX(0); } }
    @keyframes slideout { to { transform: translateX(430px); opacity: 0; } }

    /* 左侧识别条：普通=Xbox 绿，稀有=金 */
    .card::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: #107c10;
    }
    .card.rare::before { background: linear-gradient(180deg, #e8c352, #b8860b); }
    .card.rare { border-color: rgba(232, 195, 82, 0.35); }

    .icon {
      width: 56px; height: 56px;
      flex: none;
      border-radius: 8px;
      background: #26292f;
      object-fit: cover;
    }
    .icon.fallback { display: flex; align-items: center; justify-content: center; font-size: 30px; }

    .body { flex: 1; min-width: 0; }
    .game {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6cc04a;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card.rare .game { color: #e8c352; }
    .title {
      font-size: 15px;
      font-weight: 600;
      margin: 2px 0 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .desc {
      font-size: 12px;
      color: #9aa0a6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .badge {
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #e8c352;
      background: rgba(232, 195, 82, 0.12);
      border: 1px solid rgba(232, 195, 82, 0.3);
      padding: 2px 8px;
      border-radius: 999px;
    }
    .progress {
      margin-top: 6px;
      height: 4px;
      border-radius: 2px;
      background: #2b2e34;
      overflow: hidden;
    }
    .progress > div { height: 100%; background: #107c10; border-radius: 2px; }
    .hint {
      text-align: right;
      font-size: 10px;
      color: rgba(255,255,255,0.25);
      margin-top: 4px;
    }

    /* ===== 样式变体（A/B 预览用；正式启用后选一套作为默认） ===== */

    /* 2. glass：毛玻璃 + 渐变 + 柔光投影 */
    .card.glass {
      background: linear-gradient(135deg, rgba(48, 54, 66, 0.72), rgba(22, 24, 30, 0.86));
      backdrop-filter: blur(18px) saturate(150%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      border-radius: 14px;
    }
    .card.glass::before { width: 3px; border-radius: 3px; margin: 10px 0; }

    /* 3. light：浅色卡片（浅色桌面更协调） */
    .card.light {
      background: #ffffff;
      color: #16181d;
      border: 1px solid rgba(0, 0, 0, 0.06);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
      border-radius: 12px;
    }
    .card.light .game { color: #0b7a2f; }
    .card.light .desc { color: #5f6368; }
    .card.light .icon { background: #eef0f3; }
    .card.light.rare { border-color: rgba(184, 134, 11, 0.45); }
    .card.light.rare .game { color: #a97a09; }
    .card.light .badge { color: #8a6408; background: rgba(232, 195, 82, 0.18); border-color: rgba(184, 134, 11, 0.35); }
    .card.light .progress { background: #e6e8eb; }

    /* 4. steam：Steam 蓝调横幅，图标更大、标题更重（已定为默认样式） */
    .card.steam {
      background: linear-gradient(135deg, #1b2838 0%, #2a475e 100%);
      border: 1px solid rgba(102, 192, 244, 0.28);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
      border-radius: 4px;
      padding: 18px 20px;
    }
    .card.steam::before {
      width: 4px;
      background: linear-gradient(180deg, #66c0f4, #2a6f97);
    }
    .card.steam .icon { width: 76px; height: 76px; border-radius: 4px; }
    .card.steam .game { color: #66c0f4; font-size: 12px; }
    .card.steam .title { font-size: 18px; margin: 4px 0 5px; }
    .card.steam .desc { color: #c3d0dc; font-size: 13px; -webkit-line-clamp: 3; }
    .card.steam .badge { font-size: 12px; }
    .card.steam .progress { margin-top: 8px; height: 5px; }
    .card.steam .progress > div { background: #66c0f4; }
    .card.steam.rare { border-color: rgba(232, 195, 82, 0.45); }
    .card.steam.rare .game { color: #e8c352; }

    /* 5. minimal：极简单行条，不显示描述 */
    .card.minimal {
      padding: 11px 14px;
      border-radius: 999px;
      background: rgba(18, 20, 24, 0.82);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4);
      align-items: center;
      gap: 10px;
    }
    .card.minimal::before { width: 3px; border-radius: 3px; margin: 8px 0; }
    .card.minimal .icon { width: 30px; height: 30px; border-radius: 6px; font-size: 16px; }
    .card.minimal .title { font-size: 13px; margin: 0; }
    .card.minimal .game { font-size: 10px; }
    .card.minimal .desc, .card.minimal .badge, .card.minimal .progress { display: none; }
    .card.minimal.rare { border-color: rgba(232, 195, 82, 0.4); }

    /* 6. xbox：Xbox 风格——更高、大圆图标带光环、厚进度条 */
    .card.xbox {
      padding: 18px 20px;
      border-radius: 8px;
      background:
        radial-gradient(120% 140% at 0% 50%, rgba(16, 124, 16, 0.3), transparent 55%),
        #0d0f0c;
      border: 1px solid rgba(155, 240, 11, 0.25);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.55);
    }
    .card.xbox::before {
      width: 4px;
      background: linear-gradient(180deg, #9bf00b, #107c10);
    }
    .card.xbox .icon {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 2px solid rgba(155, 240, 11, 0.5);
      box-shadow: 0 0 18px rgba(155, 240, 11, 0.25);
      background: #15180f;
    }
    .card.xbox .game { color: #9bf00b; }
    .card.xbox .title { font-size: 18px; margin: 3px 0 5px; }
    .card.xbox .desc { font-size: 12.5px; color: #aab3a5; -webkit-line-clamp: 3; }
    .card.xbox .progress { margin-top: 10px; height: 6px; border-radius: 3px; background: #23281c; }
    .card.xbox .progress > div {
      background: linear-gradient(90deg, #107c10, #9bf00b);
      box-shadow: 0 0 10px rgba(155, 240, 11, 0.4);
    }
    .card.xbox.rare { border-color: rgba(232, 195, 82, 0.4); }
    .card.xbox.rare .game { color: #e8c352; }
    .card.xbox.rare::before { background: linear-gradient(180deg, #e8c352, #b8860b); }
  </style>
</head>
<body>
  <div id="stack"></div>
  <script src="overlay.js"></script>
</body>
</html>
